services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: c4_project.settings.dev
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
