databases:
  - name: seeforce-db
    databaseName: seeforce
    user: seeforce
    plan: free

services:
  - type: web
    name: seeforce
    runtime: python
    rootDir: .
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn c4_project.wsgi --workers 2 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: c4_project.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: seeforce-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false  # set to your render domain, e.g. seeforce.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false  # set to https://seeforce.onrender.com/
