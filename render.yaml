services:
  - type: web
    name: seeforce
    runtime: python
    rootDir: .
    buildCommand: bash build.sh
    startCommand: bash backend/start.sh
    plan: free
    previews:
      # Opt-in: only a PR labelled `render-preview` gets one, since free hours are shared.
      generation: manual
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: c4_project.settings.prod
        # NOTE: only Pro preview environments read this; build.sh and start.sh do the real switch.
        previewValue: c4_project.settings.preview
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false  # set once in the Render dashboard; only used to seed preview logins
      - key: DATABASE_URL
        # NOTE: dashboard-managed on purpose — free databases expire every 30 days, and a
        # blueprint that names one repoints production at it once it dies.
        sync: false
      - key: ALLOWED_HOSTS
        sync: false  # set to your render domain, e.g. seeforce.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false  # set to https://seeforce.onrender.com/
