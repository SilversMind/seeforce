[project]
name = "c4-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "django-allauth[socialaccount]>=65.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "anthropic>=0.120.0",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "mcp>=2.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "c4_project.settings.dev"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["c4_project", "apps", "c4parser"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
