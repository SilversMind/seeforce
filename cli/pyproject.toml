[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seeforce"
version = "0.1.0"
description = "CLI for SeeForce — validate and publish C4 architecture maps"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "seeforce-c4parser[static-facts]>=0.1.0",
    "mcp>=2.0",
]

[project.scripts]
seeforce = "seeforce_cli.main:cli"
seeforce-mcp = "seeforce_cli.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["seeforce_cli"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
seeforce-c4parser = { path = "../packages/c4parser", editable = true }
