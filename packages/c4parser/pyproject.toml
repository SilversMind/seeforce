[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seeforce-c4parser"
version = "0.1.0"
description = "Shared C4 annotation parser for SeeForce"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["c4parser"]
